name: CI
on:
  pull_request: {}
  push: { branches: [master] }

jobs:
  requestActivationFile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0

      - name: Request manual activation file
        uses: ./
        id: getManualLicenseFile
        with:
            entrypoint: /request_activation.sh

      - name: Expose as artifact
        uses: actions/upload-artifact@3446296876d12d4e3a0f3145a3c87e67bf0a16b5 # v1.0.0
        with:
            name: Manual Activation File
            path: ${{ steps.getManualLicenseFile.outputs.filePath }}
  

  testRunnerInEditMode:
    name: Test edit mode 📝
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}   
    steps:
      # Checkout repository (required to test local actions)
      - name: Checkout repository
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0

      - name: Activate license
        uses: ./
        with:
          entrypoint: /activate.sh

      # Configure test runner
      - name: Run tests
        uses: ./
        with:
          args: -runTests -projectPath .
          workdir: unity-project-with-correct-tests
      
      # no need to return license for personal licenses
      #- name: Return license
      #  if: always()
      #  uses: ./
      #  with:
      #    args: -returnlicense -quit      

